name: Deploy to Cloudflare Workers

# Lovable publishes the live site (offline.ogbot.co.uk) now, so this only runs when started by hand.
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and test
        run: |
          bunx tsc --noEmit -p .
          bun run test

      # VITE_SUPABASE_* are public (publishable key) and committed in .env,
      # so the build needs no secrets. Only deployment needs the CF token.
      - name: Build (Cloudflare Workers bundle)
        run: bun run build

      # Run from the repo root: the build writes .wrangler/deploy/config.json
      # there, which redirects wrangler to the generated .output/server config.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
